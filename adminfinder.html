<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Schedule Matcher</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 p-6 md:p-10">

    <div class="max-w-5xl mx-auto">
        <div class="mb-8">
            <h1 class="text-3xl font-bold text-gray-800">Class Time Matcher</h1>
            <p class="text-gray-500 mt-2">Finds times where 2 or more students are in the <strong>same subject</strong>, on the <strong>same day</strong>, at the <strong>same time</strong>.</p>
        </div>

        <!-- Action Buttons -->
        <div class="flex gap-4 mb-6">
            <button id="fetchBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg transition">
                Fetch Live Data
            </button>
            <button id="parseBtn" class="bg-gray-600 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded-lg transition">
                Use Pasted Data
            </button>
        </div>

        <!-- Status / Error Message -->
        <div id="statusMsg" class="hidden mb-6 p-4 rounded-lg"></div>

        <!-- Fallback Textarea -->
        <div class="mb-8">
            <label class="block text-sm font-medium text-gray-700 mb-2">Fallback: Paste JSON data here (if live fetch fails)</label>
            <textarea id="jsonInput" class="w-full h-40 p-3 border border-gray-300 rounded-lg font-mono text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder='Paste JSON array here...'></textarea>
        </div>

        <!-- Results Container -->
        <div id="resultsContainer" class="hidden">
            <h2 class="text-2xl font-bold text-gray-800 mb-4">Available Matches</h2>
            <div id="resultsList" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
        </div>
    </div>

    <script>
        const API_URL = "https://opensheet.elk.sh/1abo2cYRAt44q9Q3alwsL5svQJzZeTEsYtHFqgkghsQ8/responses67";
        
        // Days mapping to handle typos and sort correctly
        const dayMap = {
            "mon": { name: "Monday", order: 1 },
            "tue": { name: "Tuesday", order: 2 },
            "wed": { name: "Wednesday", order: 3 },
            "thu": { name: "Thursday", order: 4 },
            "fri": { name: "Friday", order: 5 },
            "sat": { name: "Saturday", order: 6 },
            "sun": { name: "Sunday", order: 7 }
        };

        // Time sorting map
        const timeOrder = [
            "9:00 AM - 10:00 AM (only Saturday)",
            "9:00 AM - 10: 30 AM (only Saturday)",
            "7:00 PM - 8:00 PM (All Days)",
            "7:30 PM - 8:30 PM (All Days)",
            "7:45 PM - 8:45 PM (All Days)",
            "8:00 PM - 9:00 PM (All Days)",
            "8:30 PM - 9:30 PM (All Days)"
        ];

        function normalizeDay(inputDay) {
            if (!inputDay) return null;
            const lower = inputDay.toLowerCase().trim();
            for (const key in dayMap) {
                if (lower.startsWith(key)) {
                    return dayMap[key];
                }
            }
            return null;
        }

        // Convert string to Title Case (e.g., "Pre-algebra" -> "Pre-Algebra")
        function toTitleCase(str) {
            return str.replace(/\w\S*/g, function(txt){
                return txt.charAt(0).toUpperCase() + txt.substr(1).toLowerCase();
            });
        }

        function processData(data) {
            const scheduleMap = {};

            data.forEach(student => {
                const studentName = student["Student's name."];
                if (!studentName) return;

                // Get and format subject
                let subject = student["What subject would the student be attending?"] || "General";
                subject = subject.trim();
                const subjectDisplay = toTitleCase(subject);
                const subjectKey = subject.toLowerCase();

                // Loop through all keys to find availability columns
                Object.keys(student).forEach(key => {
                    if (key.includes("What Time(s) is your student available for meetings?")) {
                        const selectedDays = student[key];
                        
                        // Extract just the time part from the key using regex
                        const timeMatch = key.match(/\[(.*?)\]/);
                        if (!timeMatch) return;
                        const timeSlot = timeMatch[1];

                        const dayInfo = normalizeDay(selectedDays);
                        
                        if (dayInfo) {
                            // Create a composite key including Subject, Day, and Time
                            const compositeKey = `${subjectKey}___${dayInfo.name}___${timeSlot}`;
                            
                            if (!scheduleMap[compositeKey]) {
                                scheduleMap[compositeKey] = {
                                    subject: subjectDisplay,
                                    day: dayInfo.name,
                                    dayOrder: dayInfo.order,
                                    time: timeSlot,
                                    students: new Set()
                                };
                            }
                            scheduleMap[compositeKey].students.add(studentName);
                        }
                    }
                });
            });

            // Filter to only show matches where 2 or more students overlap
            const matches = Object.values(scheduleMap).filter(match => match.students.size >= 2);

            // Sort by Subject, then Day, then Time
            matches.sort((a, b) => {
                if (a.subject.toLowerCase() !== b.subject.toLowerCase()) {
                    return a.subject.toLowerCase().localeCompare(b.subject.toLowerCase());
                }
                if (a.dayOrder !== b.dayOrder) return a.dayOrder - b.dayOrder;
                return timeOrder.indexOf(a.time) - timeOrder.indexOf(b.time);
            });

            displayMatches(matches);
        }

        function displayMatches(matches) {
            const container = document.getElementById('resultsContainer');
            const list = document.getElementById('resultsList');
            list.innerHTML = '';

            if (matches.length === 0) {
                list.innerHTML = '<p class="text-gray-500 col-span-2">No overlapping times found where 2 or more students are in the same subject at the same time.</p>';
                container.classList.remove('hidden');
                return;
            }

            matches.forEach(match => {
                const studentCount = match.students.size;
                const studentsArray = Array.from(match.students);
                
                const card = document.createElement('div');
                card.className = 'bg-white p-5 rounded-xl shadow-sm border border-gray-100 hover:shadow-md transition';
                
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-3">
                        <div>
                            <span class="inline-block bg-indigo-100 text-indigo-800 text-xs font-bold px-3 py-1 rounded-full mb-2">${match.subject}</span>
                            <h3 class="text-xl font-bold text-gray-800">${match.day}</h3>
                            <p class="text-blue-600 font-medium">${match.time}</p>
                        </div>
                        <span class="bg-green-100 text-green-800 text-xs font-bold px-3 py-1 rounded-full">
                            ${studentCount} Students
                        </span>
                    </div>
                    <div class="border-t border-gray-100 pt-3">
                        <p class="text-xs uppercase tracking-wide text-gray-400 mb-2">Available Students:</p>
                        <div class="flex flex-wrap gap-2">
                            ${studentsArray.map(name => `<span class="bg-gray-100 text-gray-700 text-sm px-3 py-1 rounded-md">${name}</span>`).join('')}
                        </div>
                    </div>
                `;
                
                list.appendChild(card);
            });

            container.classList.remove('hidden');
        }

        function setStatus(message, type) {
            const status = document.getElementById('statusMsg');
            status.innerText = message;
            status.classList.remove('hidden', 'bg-red-100', 'text-red-700', 'bg-green-100', 'text-green-700', 'bg-blue-100', 'text-blue-700');
            
            if (type === 'error') {
                status.classList.add('bg-red-100', 'text-red-700');
            } else if (type === 'success') {
                status.classList.add('bg-green-100', 'text-green-700');
            } else {
                status.classList.add('bg-blue-100', 'text-blue-700');
            }
        }

        async function fetchLiveData() {
            setStatus("Fetching live data...", 'info');
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error("Network response was not ok");
                const data = await response.json();
                setStatus("Successfully fetched live data!", 'success');
                processData(data);
            } catch (error) {
                setStatus("Live fetch failed (likely due to browser CORS security). Please paste your JSON data in the box below and click 'Use Pasted Data'.", 'error');
                console.error(error);
            }
        }

        function parsePastedData() {
            const jsonText = document.getElementById('jsonInput').value;
            try {
                const data = JSON.parse(jsonText);
                setStatus("Successfully parsed pasted data!", 'success');
                processData(data);
            } catch (error) {
                setStatus("Invalid JSON format. Please check your pasted data.", 'error');
                console.error(error);
            }
        }

        // Event Listeners
        document.getElementById('fetchBtn').addEventListener('click', fetchLiveData);

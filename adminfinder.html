<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Schedule Matcher</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 p-6 md:p-10">

    <div class="max-w-5xl mx-auto">
        <div class="mb-8">
            <h1 class="text-3xl font-bold text-gray-800">Class Time Matcher</h1>
            <p class="text-gray-500 mt-2">Finds times where 2 or more students are in the <strong>same subject</strong>, on the <strong>same day</strong>, at the <strong>same time</strong>.</p>
        </div>

        <!-- Configuration Key Management -->
        <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-200 mb-6 space-y-4">
            <div class="flex justify-between items-center border-b border-gray-100 pb-3">
                <h2 class="text-lg font-bold text-gray-800">Configuration Key</h2>
                <div class="flex gap-2">
                    <label class="cursor-pointer bg-blue-500 hover:bg-blue-600 text-white text-sm font-bold py-2 px-4 rounded-lg transition">
                        Upload JSON
                        <input id="uploadConfigInput" type="file" accept=".json" class="hidden">
                    </label>
                    <button id="exportConfigBtn" class="bg-gray-700 hover:bg-gray-800 text-white text-sm font-bold py-2 px-4 rounded-lg transition">Export JSON</button>
                </div>
            </div>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">1. Form Responses API URL (OpenSheet)</label>
                    <div class="flex gap-2">
                        <input id="formApiUrl" type="text" class="flex-1 p-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="https://opensheet.elk.sh/.../responses67">
                        <button id="saveFormApiBtn" class="bg-gray-700 hover:bg-gray-800 text-white font-bold py-2 px-4 rounded-lg transition">Save</button>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">2. Student Levels Apps Script URL</label>
                    <div class="flex gap-2">
                        <input id="scriptUrl" type="text" class="flex-1 p-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="https://script.google.com/macros/s/STUDENT_LEVELS_URL/exec">
                        <button id="saveUrlBtn" class="bg-gray-700 hover:bg-gray-800 text-white font-bold py-2 px-4 rounded-lg transition">Save</button>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">3. Tutor Sheet Apps Script URL</label>
                    <div class="flex gap-2">
                        <input id="tutorScriptUrl" type="text" class="flex-1 p-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="https://script.google.com/macros/s/TUTOR_SHEET_URL/exec">
                        <button id="saveTutorUrlBtn" class="bg-gray-700 hover:bg-gray-800 text-white font-bold py-2 px-4 rounded-lg transition">Save</button>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">4. Meetings API Apps Script URL</label>
                    <div class="flex gap-2">
                        <input id="meetingsScriptUrl" type="text" class="flex-1 p-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="https://script.google.com/macros/s/MEETINGS_URL/exec">
                        <button id="saveMeetingsUrlBtn" class="bg-gray-700 hover:bg-gray-800 text-white font-bold py-2 px-4 rounded-lg transition">Save</button>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">5. Meetings API Fetch URL (OpenSheet link to auto-fetch NEW USERs)</label>
                    <div class="flex gap-2">
                        <input id="meetingsApiUrl" type="text" class="flex-1 p-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="https://opensheet.elk.sh/.../Meetings">
                        <button id="saveMeetingsApiUrlBtn" class="bg-gray-700 hover:bg-gray-800 text-white font-bold py-2 px-4 rounded-lg transition">Save</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Action Buttons & Toggles -->
        <div class="flex flex-wrap gap-4 items-center mb-6">
            <button id="fetchBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg transition">
                Fetch Live Data
            </button>
            <button id="parseBtn" class="bg-gray-600 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded-lg transition">
                Use Pasted Data
            </button>
            <div class="flex items-center ml-2">
                <input id="showNonMatches" type="checkbox" class="w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500 cursor-pointer">
                <label for="showNonMatches" class="ml-2 text-sm font-medium text-gray-700 cursor-pointer">Show Non-Matches (1 student)</label>
            </div>
        </div>

        <!-- Status / Error Message -->
        <div id="statusMsg" class="hidden mb-6 p-4 rounded-lg"></div>

        <!-- Fallback Textareas -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Fallback: Paste Form Responses JSON here</label>
                <textarea id="jsonInput" class="w-full h-40 p-3 border border-gray-300 rounded-lg font-mono text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder='Paste form JSON here...'></textarea>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">2. Paste Meetings API JSON here (Required to find NEW USERs)</label>
                <textarea id="meetingsJsonInput" class="w-full h-40 p-3 border border-gray-300 rounded-lg font-mono text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder='Paste meetings JSON here...'></textarea>
            </div>
        </div>

        <!-- Results Container -->
        <div id="resultsContainer" class="hidden">
            <h2 class="text-2xl font-bold text-gray-800 mb-4">Available Matches</h2>
            <div id="resultsList" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
        </div>
    </div>

    <script>
        // Pre-fill the Meetings JSON so it works out of the box
        document.getElementById('meetingsJsonInput').value = JSON.stringify([
          {" ":"Inbha","Link to meeting":"https://meet.jit.si/DifferentGendersCiteApproximately ","Meeting Topic":"Algebra 1","Date and Time":"1:00 PM – 2:00 PM","User's classes":"Every Sunday, Monday"},
          {" ":"Inbhamathlyon","Link to meeting":"https://meet.jit.si/DifferentGendersCiteApproximately","Meeting Topic":"Algebra 1","Date and Time":"4:00 PM – 5:00 PM","User's classes":"Every Sunday, Monday"},
          {" ":"joemumath","Link to meeting":"https://meet.jit.si/DifferentGendersCiteApproximately","Meeting Topic":"Algebra 1","Date and Time":"4:00 PM – 5:00 PM","User's classes":"Every Sunday, Monday"},
          {" ":"newuser1","Link to meeting":"https://meet.jit.si/DifferentGendersCiteApproximately","Meeting Topic":"Algebra 1","Date and Time":"4:00 PM – 5:00 PM","User's classes":"Every Sunday, Monday"},
          {" ":"Mightyadvait"},
          {" ":"PranavN","Link to meeting":"https://meet.jit.si/DifferentGendersCiteApproximately","Meeting Topic":"Algebra 1","Date and Time":"4:00 PM – 5:00 PM","User's classes":"Every Sunday, Monday"},
          {" ":"user112","Link to meeting":"NEW USER"},
          {" ":"bobs2","Link to meeting":"NEW USER"},
          {" ":"ergseg","Link to meeting":"NEW USER"}
        ], null, 2);

        const dayMap = {
            "mon": { name: "Monday", order: 1 },
            "tue": { name: "Tuesday", order: 2 },
            "wed": { name: "Wednesday", order: 3 },
            "thu": { name: "Thursday", order: 4 },
            "fri": { name: "Friday", order: 5 },
            "sat": { name: "Saturday", order: 6 },
            "sun": { name: "Sunday", order: 7 }
        };

        const timeOrder = [
            "9:00 AM - 10:00 AM (only Saturday)",
            "9:00 AM - 10: 30 AM (only Saturday)",
            "7:00 PM - 8:00 PM (All Days)",
            "7:30 PM - 8:30 PM (All Days)",
            "7:45 PM - 8:45 PM (All Days)",
            "8:00 PM - 9:00 PM (All Days)",
            "8:30 PM - 9:30 PM (All Days)"
        ];

        function normalizeDay(inputDay) {
            if (!inputDay) return null;
            const lower = inputDay.toLowerCase().trim();
            for (const key in dayMap) {
                if (lower.startsWith(key)) return dayMap[key];
            }
            return null;
        }

        function toTitleCase(str) {
            return str.replace(/\w\S*/g, function(txt){
                return txt.charAt(0).toUpperCase() + txt.substr(1).toLowerCase();
            });
        }

        function formatTimeForSheet(timeStr) {
            return timeStr
                .replace(/\s*\(.*?\)\s*/g, '') 
                .replace(/\s-\s/g, ' – ');       
        }

        function setStatus(message, type) {
            const status = document.getElementById('statusMsg');
            status.innerText = message;
            status.classList.remove('hidden', 'bg-red-100', 'text-red-700', 'bg-green-100', 'text-green-700', 'bg-blue-100', 'text-blue-700');
            if (type === 'error') status.classList.add('bg-red-100', 'text-red-700');
            else if (type === 'success') status.classList.add('bg-green-100', 'text-green-700');
            else status.classList.add('bg-blue-100', 'text-blue-700');
        }

        // ==========================================
        // CONFIGURATION KEY LOGIC
        // ==========================================

        function loadConfig() {
            if(localStorage.getItem('formApiUrl')) document.getElementById('formApiUrl').value = localStorage.getItem('formApiUrl');
            if(localStorage.getItem('appsScriptUrl')) document.getElementById('scriptUrl').value = localStorage.getItem('appsScriptUrl');
            if(localStorage.getItem('tutorScriptUrl')) document.getElementById('tutorScriptUrl').value = localStorage.getItem('tutorScriptUrl');
            if(localStorage.getItem('meetingsScriptUrl')) document.getElementById('meetingsScriptUrl').value = localStorage.getItem('meetingsScriptUrl');
            if(localStorage.getItem('meetingsApiUrl')) document.getElementById('meetingsApiUrl').value = localStorage.getItem('meetingsApiUrl');
        }
        loadConfig(); // Load on start

        function saveAllConfigs() {
            localStorage.setItem('formApiUrl', document.getElementById('formApiUrl').value);
            localStorage.setItem('appsScriptUrl', document.getElementById('scriptUrl').value);
            localStorage.setItem('tutorScriptUrl', document.getElementById('tutorScriptUrl').value);
            localStorage.setItem('meetingsScriptUrl', document.getElementById('meetingsScriptUrl').value);
            localStorage.setItem('meetingsApiUrl', document.getElementById('meetingsApiUrl').value);
        }

        document.getElementById('saveFormApiBtn').addEventListener('click', () => {
            localStorage.setItem('formApiUrl', document.getElementById('formApiUrl').value);
            alert("Form API URL Saved!");
        });
        document.getElementById('saveUrlBtn').addEventListener('click', () => {
            localStorage.setItem('appsScriptUrl', document.getElementById('scriptUrl').value);
            alert("Student URL Saved!");
        });
        document.getElementById('saveTutorUrlBtn').addEventListener('click', () => {
            localStorage.setItem('tutorScriptUrl', document.getElementById('tutorScriptUrl').value);
            alert("Tutor URL Saved!");
        });
        document.getElementById('saveMeetingsUrlBtn').addEventListener('click', () => {
            localStorage.setItem('meetingsScriptUrl', document.getElementById('meetingsScriptUrl').value);
            alert("Meetings Script URL Saved!");
        });
        document.getElementById('saveMeetingsApiUrlBtn').addEventListener('click', () => {
            localStorage.setItem('meetingsApiUrl', document.getElementById('meetingsApiUrl').value);
            alert("Meetings Fetch URL Saved!");
        });

        // Export Config JSON
        document.getElementById('exportConfigBtn').addEventListener('click', () => {
            const configData = {
                formApiUrl: document.getElementById('formApiUrl').value,
                studentLevelsUrl: document.getElementById('scriptUrl').value,
                tutorSheetUrl: document.getElementById('tutorScriptUrl').value,
                meetingsScriptUrl: document.getElementById('meetingsScriptUrl').value,
                meetingsApiUrl: document.getElementById('meetingsApiUrl').value
            };
            
            const blob = new Blob([JSON.stringify(configData, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'scheduler_config.json';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });

        // Import Config JSON
        document.getElementById('uploadConfigInput').addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const config = JSON.parse(e.target.result);
                    
                    if (config.formApiUrl) document.getElementById('formApiUrl').value = config.formApiUrl;
                    if (config.studentLevelsUrl) document.getElementById('scriptUrl').value = config.studentLevelsUrl;
                    if (config.tutorSheetUrl) document.getElementById('tutorScriptUrl').value = config.tutorSheetUrl;
                    if (config.meetingsScriptUrl) document.getElementById('meetingsScriptUrl').value = config.meetingsScriptUrl;
                    if (config.meetingsApiUrl) document.getElementById('meetingsApiUrl').value = config.meetingsApiUrl;

                    saveAllConfigs();
                    setStatus("Configuration uploaded and saved successfully!", 'success');
                } catch (err) {
                    setStatus("Failed to parse JSON config file. Make sure it is valid.", 'error');
                }
            };
            reader.readAsText(file);
        });


        // ==========================================
        // DATA PROCESSING LOGIC
        // ==========================================

        function processData(formData) {
            const meetingsDataText = document.getElementById('meetingsJsonInput').value;
            const showNonMatches = document.getElementById('showNonMatches').checked;
            
            if (!meetingsDataText) {
                setStatus("Please paste the Meetings API JSON into the second box so the tool can look for 'NEW USER's.", 'error');
                return;
            }

            // Parse Meetings Data and build a Set of ONLY "NEW USER" usernames (case-insensitive)
            const newUsernames = new Set();
            try {
                const meetingsData = JSON.parse(meetingsDataText);
                meetingsData.forEach(m => {
                    if (m["Link to meeting"] && String(m["Link to meeting"]).toLowerCase().trim() === 'new user') {
                        const username = m["Username"] || m[" "];
                        if (username) newUsernames.add(String(username).toLowerCase().trim());
                    }
                });
            } catch (error) {
                setStatus("Invalid Meetings JSON format. Cannot filter NEW USERs.", 'error');
                return;
            }

            if (newUsernames.size === 0) {
                setStatus("No users with 'NEW USER' found in the Meetings API data.", 'error');
                return;
            }

            const scheduleMap = {};

            formData.forEach(student => {
                const studentName = student["Student's name."];
                const studentAccount = student["What would you like the student's account name to be? You will be emailed a password (and the username below) as their login credentials. "];
                
                const nameLower = studentName ? studentName.toLowerCase().trim() : null;
                const accountLower = studentAccount ? studentAccount.toLowerCase().trim() : null;

                // ONLY include them if they are explicitly in the NEW USER list
                const isNewUser = (nameLower && newUsernames.has(nameLower)) || (accountLower && newUsernames.has(accountLower));

                if (!studentName || !isNewUser) return;

                let subject = student["What subject would the student be attending?"] || "General";
                subject = subject.trim();
                const subjectDisplay = toTitleCase(subject);
                const subjectKey = subject.toLowerCase();

                Object.keys(student).forEach(key => {
                    if (key.includes("What Time(s) is your student available for meetings?")) {
                        const selectedDays = student[key];
                        const timeMatch = key.match(/\[(.*?)\]/);
                        if (!timeMatch) return;
                        const timeSlot = timeMatch[1];

                        const dayInfo = normalizeDay(selectedDays);
                        
                        if (dayInfo) {
                            const compositeKey = `${subjectKey}___${dayInfo.name}___${timeSlot}`;
                            if (!scheduleMap[compositeKey]) {
                                scheduleMap[compositeKey] = {
                                    subject: subjectDisplay,
                                    day: dayInfo.name,
                                    dayOrder: dayInfo.order,
                                    time: timeSlot,
                                    students: new Set()
                                };
                            }
                            scheduleMap[compositeKey].students.add(studentName);
                        }
                    }
                });
            });

            // Filter based on whether we want matches (2+) or non-matches (1)
            const minStudents = showNonMatches ? 1 : 2;
            const matches = Object.values(scheduleMap).filter(match => match.students.size >= minStudents);
            
            matches.sort((a, b) => {
                if (a.subject.toLowerCase() !== b.subject.toLowerCase()) return a.subject.toLowerCase().localeCompare(b.subject.toLowerCase());
                if (a.dayOrder !== b.dayOrder) return a.dayOrder - b.dayOrder;
                return timeOrder.indexOf(a.time) - timeOrder.indexOf(b.time);
            });

            displayMatches(matches, showNonMatches);
            setStatus(`Successfully processed! Found ${matches.length} ${showNonMatches ? 'records (including 1-student non-matches)' : 'potential matches'}.`, 'success');
        }

        function displayMatches(matches, showNonMatches) {
            const container = document.getElementById('resultsContainer');
            const list = document.getElementById('resultsList');
            list.innerHTML = '';

            if (matches.length === 0) {
                list.innerHTML = `<p class="text-gray-500 col-span-2">No ${showNonMatches ? 'unmatched students' : 'overlapping times'} found for "NEW USER" students.</p>`;
                container.classList.remove('hidden');
                return;
            }

            matches.forEach(match => {
                const studentCount = match.students.size;
                const studentsArray = Array.from(match.students);
                const safeId = `${match.subject}_${match.day}_${match.time}`.replace(/[^a-zA-Z0-9]/g, '_');
                
                const card = document.createElement('div');
                // Add a yellow border to non-matches to distinguish them visually
                const borderClass = studentCount === 1 ? 'border-yellow-300 bg-yellow-50' : 'border-gray-100 bg-white';
                card.className = `p-5 rounded-xl shadow-sm border ${borderClass} hover:shadow-md transition flex flex-col`;
                
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-3">
                        <div>
                            <span class="inline-block bg-indigo-100 text-indigo-800 text-xs font-bold px-3 py-1 rounded-full mb-2">${match.subject}</span>
                            <h3 class="text-xl font-bold text-gray-800">${match.day}</h3>
                            <p class="text-blue-600 font-medium">${match.time}</p>
                        </div>
                        <span class="bg-green-100 text-green-800 text-xs font-bold px-3 py-1 rounded-full">
                            ${studentCount} Student${studentCount > 1 ? 's' : ''}
                        </span>
                    </div>
                    <div class="border-t border-gray-100 pt-3 flex-grow">
                        <p class="text-xs uppercase tracking-wide text-gray-400 mb-2">Available Students:</p>
                        <div class="flex flex-wrap gap-2">
                            ${studentsArray.map(name => `<span class="bg-gray-100 text-gray-700 text-sm px-3 py-1 rounded-md">${name}</span>`).join('')}
                        </div>
                    </div>
                    
                    <!-- Admin Approval Section -->
                    <div class="mt-4 pt-4 border-t-2 border-dashed border-gray-100 space-y-2">
                        <div class="grid grid-cols-2 gap-2">
                            <input id="level_${safeId}" type="number" min="1" placeholder="Lvl #" class="p-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                            <input id="tutor_${safeId}" type="text" placeholder="Tutor Name" class="p-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                            <input id="pass_${safeId}" type="text" placeholder="Tutor Password" class="p-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                            <input id="link_${safeId}" type="text" placeholder="Meeting Link" class="p-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        </div>
                        <button id="btn_${safeId}" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-bold py-2 px-4 rounded-lg transition mt-2">
                            Approve Class
                        </button>
                    </div>
                `;
                
                list.appendChild(card);

                document.getElementById(`btn_${safeId}`).addEventListener('click', async () => {
                    const levelInput = document.getElementById(`level_${safeId}`).value;
                    const tutorInput = document.getElementById(`tutor_${safeId}`).value;
                    const passInput = document.getElementById(`pass_${safeId}`).value;
                    const linkInput = document.getElementById(`link_${safeId}`).value;
                    const btn = document.getElementById(`btn_${safeId}`);
                    
                    if (!levelInput || !tutorInput || !passInput || !linkInput) {
                        alert("Please fill out Lvl #, Tutor Name, Tutor Password, and Meeting Link.");
                        return;
                    }
                    
                    btn.innerText = "Updating...";
                    btn.disabled = true;

                    try {
                        await approveClassAndAssignTutor(match, studentsArray, levelInput, tutorInput, passInput, linkInput, btn);
                    } catch (error) {
                        alert("Failed to update: " + error.message);
                        btn.innerText = "Retry";
                        btn.disabled = false;
                    }
                });
            });

            container.classList.remove('hidden');
        }

        async function approveClassAndAssignTutor(match, studentsArray, levelInput, tutorInput, passInput, linkInput, btn) {
            const studentScriptUrl = document.getElementById('scriptUrl').value;
            const tutorScriptUrl = document.getElementById('tutorScriptUrl').value;
            const meetingsScriptUrl = document.getElementById('meetingsScriptUrl').value;

            if (!studentScriptUrl || !tutorScriptUrl || !meetingsScriptUrl) {
                throw new Error("Please fill out all 3 Apps Script URLs at the top of the page.");
            }

            const subjectLevelStr = `${match.subject}-lvl${levelInput}`;
            const formattedTime = formatTimeForSheet(match.time);
            const dayString = `Every ${match.day}`;
            
            // 1. Update Student Levels
            const studentPromise = fetch(studentScriptUrl, {
                method: 'POST',
                body: JSON.stringify({ 
                    students: studentsArray, 
                    subjectLevel: subjectLevelStr 
                }),
                headers: { 'Content-Type': 'text/plain;charset=utf-8' }
            }).then(res => res.json());

            // 2. Add to Tutor Sheet
            const tutorPromise = fetch(tutorScriptUrl, {
                method: 'POST',
                body: JSON.stringify({
                    tutorName: tutorInput,
                    password: passInput,
                    students: studentsArray,
                    meetingTime: formattedTime,
                    date: dayString,
                    topic: match.subject,
                    meetingLink: linkInput
                }),
                headers: { 'Content-Type': 'text/plain;charset=utf-8' }
            }).then(res => res.json());

            // 3. Update Meetings API
            const meetingsPromise = fetch(meetingsScriptUrl, {
                method: 'POST',
                body: JSON.stringify({
                    students: studentsArray,
                    meetingLink: linkInput,
                    topic: match.subject,
                    time: formattedTime,
                    day: dayString
                }),
                headers: { 'Content-Type': 'text/plain;charset=utf-8' }
            }).then(res => res.json());

            // Wait for all three to finish
            const [studentRes, tutorRes, meetingsRes] = await Promise.all([studentPromise, tutorPromise, meetingsPromise]);

            if (studentRes.status === 'success' && tutorRes.status === 'success' && meetingsRes.status === 'success') {
                btn.innerText = `Approved!`;
                btn.classList.remove('bg-indigo-600', 'hover:bg-indigo-700');
                btn.classList.add('bg-green-600', 'cursor-default');
            } else {
                console.error("API Results:", {studentRes, tutorRes, meetingsRes});
                throw new Error("One of the scripts failed. Check console for details.");
            }
        }

        async function fetchLiveData() {
            const formApiUrl = document.getElementById('formApiUrl').value;
            if (!formApiUrl) {
                setStatus("Please enter the Form Responses API URL in the Configuration section.", 'error');
                return;
            }

            setStatus("Fetching live data...", 'info');
            try {
                // If they provided a Meetings API URL, fetch it automatically first
                const meetingsApiUrl = document.getElementById('meetingsApiUrl').value;
                if (meetingsApiUrl) {
                    try {
                        const mResponse = await fetch(meetingsApiUrl);
                        if (mResponse.ok) {
                            const mData = await mResponse.json();
                            document.getElementById('meetingsJsonInput').value = JSON.stringify(mData, null, 2);
                        }
                    } catch (e) {
                        console.error("Could not fetch Meetings API URL", e);
                    }
                }

                const response = await fetch(formApiUrl);
                if (!response.ok) throw new Error("Network response was not ok");
                const data = await response.json();
                setStatus("Successfully fetched live data!", 'success');
                processData(data);
            } catch (error) {
                setStatus("Live fetch failed (likely due to browser CORS security). Please paste your JSON data in the boxes below and click 'Use Pasted Data'.", 'error');
                console.error(error);
            }
        }

        function parsePastedData() {
            const jsonText = document.getElementById('jsonInput').value;
            if(!jsonText) {
                setStatus("Please paste Form JSON data into the first text area first.", 'error');
                return;
            }
            try {
                const data = JSON.parse(jsonText);
                setStatus("Successfully parsed pasted data!", 'success');
                processData(data);
            } catch (error) {
                setStatus("Invalid JSON format. Please check your pasted data.", 'error');
            }
        }

        document.getElementById('fetchBtn').addEventListener('click', fetchLiveData);
        document.getElementById('parseBtn').addEventListener('click', parsePastedData);
    </script>
</body>
</html>

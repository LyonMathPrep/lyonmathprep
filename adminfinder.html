<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Availability Overlap Finder | Lyon Math Prep</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: #f0f2f5;
      color: #1a1a1a;
      padding: 30px 20px;
    }
    .container { max-width: 1100px; margin: 0 auto; }
    h1 { font-size: 26px; margin-bottom: 4px; }
    .subtitle { color: #555; margin-bottom: 24px; font-size: 15px; }

    .controls {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 24px;
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      align-items: flex-end;
    }
    .control-group { display: flex; flex-direction: column; gap: 4px; }
    .control-group label { font-size: 12px; font-weight: 600; color: #555; text-transform: uppercase; letter-spacing: 0.5px; }
    .control-group select {
      padding: 8px 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
      min-width: 180px;
    }
    .btn {
      padding: 9px 20px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-primary { background: #2563eb; color: #fff; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-secondary { background: #e5e7eb; color: #333; }
    .btn-secondary:hover { background: #d1d5db; }

    .student-selector {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 24px;
    }
    .student-selector h2 { font-size: 16px; margin-bottom: 4px; }
    .student-selector .hint { font-size: 13px; color: #777; margin-bottom: 12px; }
    .student-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 8px;
    }
    .student-check {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s;
      font-size: 14px;
    }
    .student-check:hover { background: #f0f7ff; border-color: #93c5fd; }
    .student-check.checked { background: #eff6ff; border-color: #3b82f6; }
    .student-check input { accent-color: #2563eb; width: 16px; height: 16px; cursor: pointer; }
    .student-check .sname { font-weight: 600; }
    .student-check .smeta { color: #666; font-size: 12px; }

    .results {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 24px;
    }
    .results h2 { font-size: 18px; margin-bottom: 16px; }
    .no-results { color: #888; font-size: 14px; padding: 20px 0; text-align: center; }

    .overlap-card {
      border: 1px solid #d1fae5;
      background: #f0fdf4;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .overlap-card h3 {
      font-size: 15px;
      color: #065f46;
      margin-bottom: 8px;
    }
    .overlap-card .students-in {
      margin-top: 10px;
      font-size: 13px;
      color: #374151;
    }
    .overlap-card .students-in span {
      background: #e0e7ff;
      color: #3730a3;
      border-radius: 4px;
      padding: 2px 8px;
      margin-right: 6px;
      font-weight: 500;
      font-size: 12px;
    }

    .avail-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      margin-top: 12px;
    }
    .avail-table th {
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      padding: 8px 10px;
      text-align: left;
      font-weight: 600;
      color: #374151;
    }
    .avail-table td {
      border: 1px solid #e5e7eb;
      padding: 8px 10px;
    }
    .avail-table tr:nth-child(even) td { background: #fafbfc; }
    .tag-avail {
      display: inline-block;
      background: #dbeafe;
      color: #1e40af;
      border-radius: 4px;
      padding: 2px 8px;
      margin: 2px;
      font-size: 12px;
      font-weight: 500;
    }

    .section-title {
      font-size: 14px;
      font-weight: 700;
      color: #374151;
      margin: 20px 0 8px;
      padding-bottom: 6px;
      border-bottom: 2px solid #e5e7eb;
    }

    .loading-msg {
      text-align: center;
      padding: 60px 20px;
      color: #888;
      font-size: 16px;
    }

    .badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .badge-count { background: #2563eb; color: #fff; }
    .badge-subject { background: #fef3c7; color: #92400e; }
    .badge-new { background: #fecaca; color: #991b1b; }

    .select-all-row {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }

    .info-box {
      background: #fffbeb;
      border: 1px solid #fde68a;
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 13px;
      color: #92400e;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>📐 Availability Overlap Finder</h1>
  <p class="subtitle">Select new users to find common available time slots for class grouping.</p>

  <div id="app" class="loading-msg">Loading registration data...</div>
</div>

<script>
const REGISTRATION_URL = 'https://opensheet.elk.sh/1abo2cYRAt44q9Q3alwsL5svQJzZeTEsYtHFqgkghsQ8/responses67';
const MEETINGS_URL = 'https://opensheet.elk.sh/1Bpho-NecP90LqdYoxfvUxblsCoSuwQT3KYFAvonOZ10/Sheet1';

const TIME_SLOT_KEYS = [
  { key: "What Time(s) is your student available for meetings? [7:00 PM - 8:00 PM (All Days)]", label: "7:00 PM – 8:00 PM" },
  { key: "What Time(s) is your student available for meetings? [7:30 PM - 8:30 PM (All Days)]", label: "7:30 PM – 8:30 PM" },
  { key: "What Time(s) is your student available for meetings? [7:45 PM - 8:45 PM (All Days)]", label: "7:45 PM – 8:45 PM" },
  { key: "What Time(s) is your student available for meetings? [8:00 PM - 9:00 PM (All Days)]", label: "8:00 PM – 9:00 PM" },
  { key: "What Time(s) is your student available for meetings? [8:30 PM - 9:30 PM (All Days)]", label: "8:30 PM – 9:30 PM" },
  { key: "What Time(s) is your student available for meetings? [9:00 AM - 10:00 AM (only Saturday) ]", label: "9:00 AM – 10:00 AM (Sat)" },
  { key: "What Time(s) is your student available for meetings? [9:00 AM - 10: 30 AM (only Saturday)]", label: "9:00 AM – 10:30 AM (Sat)" },
];

const CANONICAL_DAYS = {
  'monday': 'Monday', 'tuesday': 'Tuesday', 'wednesday': 'Wednesday',
  'wensday': 'Wednesday', 'wendsday': 'Wednesday',
  'thursday': 'Thursday', 'friday': 'Friday', 'saturday': 'Saturday', 'sunday': 'Sunday'
};

function normalizeDay(raw) {
  const d = String(raw || '').trim().toLowerCase();
  return CANONICAL_DAYS[d] || null;
}

function parseStudent(reg) {
  const name = reg["Student's name."] || 'Unknown';
  const username = reg["What would you like the student's account name to be? You will be emailed a password (and the username below) as their login credentials. "] || '';
  const subject = reg["What subject would the student be attending?"] || '';
  const grade = reg["Student's grade."] || '';

  const slots = [];
  TIME_SLOT_KEYS.forEach(sk => {
    const val = reg[sk.key];
    if (val && String(val).trim()) {
      String(val).split(',').forEach(raw => {
        const day = normalizeDay(raw);
        if (day) {
          slots.push({ slotLabel: sk.label, day });
        }
      });
    }
  });

  return { name, username, subject, grade, slots };
}

function findOverlaps(students, minOverlap) {
  const map = {};
  students.forEach(s => {
    const seen = new Set();
    s.slots.forEach(sl => {
      const key = sl.slotLabel + '|||' + sl.day;
      if (seen.has(key)) return;
      seen.add(key);
      if (!map[key]) map[key] = [];
      map[key].push(s.name);
    });
  });

  const results = [];
  for (const key in map) {
    if (map[key].length >= minOverlap) {
      const [slotLabel, day] = key.split('|||');
      results.push({ slotLabel, day, students: map[key], count: map[key].length });
    }
  }
  const dayOrder = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
  results.sort((a, b) => {
    if (b.count !== a.count) return b.count - a.count;
    const da = dayOrder.indexOf(a.day), db = dayOrder.indexOf(b.day);
    if (da !== db) return da - db;
    return a.slotLabel.localeCompare(b.slotLabel);
  });
  return results;
}

let allNewStudents = [];

async function init() {
  const app = document.getElementById('app');
  try {
    const [regRes, meetRes] = await Promise.all([
      fetch(REGISTRATION_URL).then(r => r.json()),
      fetch(MEETINGS_URL).then(r => r.json())
    ]);

    // Build a set of usernames that are marked "NEW USER" in the meetings sheet
    const newUserUsernames = new Set();
    meetRes.forEach(m => {
      if (String(m['Link to meeting'] || '').trim().toUpperCase() === 'NEW USER') {
        newUserUsernames.add(String(m.Username || '').trim().toLowerCase());
      }
    });

    // Filter registrations to only those whose username appears as NEW USER
    const newUserRegs = regRes.filter(reg => {
      const username = String(
        reg["What would you like the student's account name to be? You will be emailed a password (and the username below) as their login credentials. "] || ''
      ).trim().toLowerCase();
      return newUserUsernames.has(username);
    });

    allNewStudents = newUserRegs.map(parseStudent).filter(s => s.slots.length > 0);

    if (allNewStudents.length === 0) {
      app.innerHTML = `
        <div class="info-box">No new users with availability data found. Either there are no "NEW USER" entries in the meetings sheet, or those users didn't fill in any time slots.</div>
      `;
      return;
    }

    renderApp();
  } catch (e) {
    app.innerHTML = '<div style="color:red;text-align:center;padding:40px;">Error loading data. Check console.</div>';
    console.error(e);
  }
}

function renderApp() {
  const app = document.getElementById('app');
  const subjects = [...new Set(allNewStudents.map(s => s.subject).filter(Boolean))].sort();

  app.innerHTML = `
    <div class="info-box">
      Showing only students marked as <strong>NEW USER</strong> in the meetings sheet. 
      <strong>${allNewStudents.length}</strong> new student(s) found with availability data.
    </div>

    <div class="controls">
      <div class="control-group">
        <label>Filter by Subject</label>
        <select id="filterSubject">
          <option value="">All Subjects</option>
          ${subjects.map(s => `<option value="${s}">${s}</option>`).join('')}
        </select>
      </div>
      <div class="control-group">
        <label>Minimum Overlap</label>
        <select id="minOverlap">
          <option value="2" selected>2 students</option>
          <option value="3">3 students</option>
          <option value="4">4 students</option>
          <option value="5">5 students</option>
        </select>
      </div>
      <button class="btn btn-primary" id="btnFind">Find Overlaps</button>
      <button class="btn btn-secondary" id="btnShowAll">Show All Availability</button>
    </div>

    <div class="student-selector" id="selectorArea">
      <h2>Select New Students</h2>
      <p class="hint">Check the new students you want to compare. Use "Find Overlaps" to see common time slots.</p>
      <div class="select-all-row">
        <button class="btn btn-secondary" id="btnSelectAll" style="font-size:12px;padding:5px 14px;">Select All</button>
        <button class="btn btn-secondary" id="btnDeselectAll" style="font-size:12px;padding:5px 14px;">Deselect All</button>
      </div>
      <div class="student-grid" id="studentGrid"></div>
    </div>

    <div class="results" id="resultsArea" style="display:none;"></div>
  `;

  renderStudentGrid();

  document.getElementById('filterSubject').addEventListener('change', renderStudentGrid);
  document.getElementById('btnSelectAll').addEventListener('click', () => toggleAll(true));
  document.getElementById('btnDeselectAll').addEventListener('click', () => toggleAll(false));
  document.getElementById('btnFind').addEventListener('click', showOverlaps);
  document.getElementById('btnShowAll').addEventListener('click', showAllAvailability);
}

function getFilteredStudents() {
  const subj = document.getElementById('filterSubject').value;
  return subj ? allNewStudents.filter(s => s.subject === subj) : allNewStudents;
}

function renderStudentGrid() {
  const grid = document.getElementById('studentGrid');
  const students = getFilteredStudents();
  grid.innerHTML = students.map(s => {
    const globalIdx = allNewStudents.indexOf(s);
    return `
      <label class="student-check checked" id="scheck-${globalIdx}">
        <input type="checkbox" data-idx="${globalIdx}" checked>
        <div>
          <div class="sname">${s.name} <span class="badge badge-new">New</span></div>
          <div class="smeta">@${s.username} · ${s.subject} · ${s.grade} · ${s.slots.length} slot(s)</div>
        </div>
      </label>
    `;
  }).join('');

  grid.querySelectorAll('input[type=checkbox]').forEach(cb => {
    cb.addEventListener('change', () => {
      cb.closest('.student-check').classList.toggle('checked', cb.checked);
    });
  });

  document.getElementById('resultsArea').style.display = 'none';
}

function toggleAll(state) {
  document.querySelectorAll('#studentGrid input[type=checkbox]').forEach(cb => {
    cb.checked = state;
    cb.closest('.student-check').classList.toggle('checked', state);
  });
}

function getSelectedStudents() {
  const idxs = [];
  document.querySelectorAll('#studentGrid input[type=checkbox]:checked').forEach(cb => {
    idxs.push(parseInt(cb.dataset.idx));
  });
  return idxs.map(i => allNewStudents[i]);
}

function showOverlaps() {
  const selected = getSelectedStudents();
  const area = document.getElementById('resultsArea');
  area.style.display = 'block';

  if (selected.length < 2) {
    area.innerHTML = '<h2>Overlap Results</h2><div class="no-results">Please select at least 2 students to find overlaps.</div>';
    return;
  }

  const minOverlap = parseInt(document.getElementById('minOverlap').value);
  const overlaps = findOverlaps(selected, minOverlap);

  if (overlaps.length === 0) {
    area.innerHTML = `
      <h2>Overlap Results</h2>
      <div class="no-results">No common time slots found among the ${selected.length} selected students with minimum overlap of ${minOverlap}.</div>
    `;
    return;
  }

  let html = `<h2>Overlap Results <span class="badge badge-count">${overlaps.length} slot(s)</span></h2>`;

  overlaps.forEach(o => {
    html += `
      <div class="overlap-card">
        <h3>${o.day} — ${o.slotLabel}</h3>
        <div class="students-in">
          <strong>${o.count} student(s):</strong><br>
          ${o.students.map(n => `<span>${n}</span>`).join('')}
        </div>
      </div>
    `;
  });

  area.innerHTML = html;
}

function showAllAvailability() {
  const selected = getSelectedStudents();
  const area = document.getElementById('resultsArea');
  area.style.display = 'block';

  if (selected.length === 0) {
    area.innerHTML = '<h2>All Availability</h2><div class="no-results">No students selected.</div>';
    return;
  }

  const days = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];

  let html = '<h2>All Availability</h2>';
  html += '<div style="overflow-x:auto;"><table class="avail-table"><thead><tr><th>Student</th><th>Subject</th>';
  days.forEach(d => html += `<th>${d.slice(0,3)}</th>`);
  html += '</tr></thead><tbody>';

  selected.forEach(s => {
    html += `<tr><td><strong>${s.name}</strong><br><span style="color:#888;font-size:11px;">@${s.username}</span></td><td><span class="badge badge-subject">${s.subject}</span></td>`;
    days.forEach(day => {
      const daySlots = s.slots.filter(sl => sl.day === day);
      html += '<td>';
      if (daySlots.length > 0) {
        daySlots.forEach(ds => {
          html += `<div class="tag-avail">${ds.slotLabel.replace(' (Sat)', '')}</div>`;
        });
      } else {
        html += '<span style="color:#ccc;">—</span>';
      }
      html += '</td>';
    });
    html += '</tr>';
  });

  html += '</tbody></table></div>';

  if (selected.length >= 2) {
    const overlaps = findOverlaps(selected, 2);
    if (overlaps.length > 0) {
      html += '<div class="section-title">Common Slots (2+ students)</div>';
      overlaps.forEach(o => {
        html += `
          <div class="overlap-card">
            <h3>${o.day} — ${o.slotLabel}</h3>
            <div class="students-in">
              <strong>${o.count}/${selected.length}:</strong>
              ${o.students.map(n => `<span>${n}</span>`).join('')}
            </div>
          </div>
        `;
      });
    }
  }

  area.innerHTML = html;
}

init();
</script>

</body>
</html>
